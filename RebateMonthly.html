<!-- =========================================================
     STEP 2 - REBATE CHECKER
     Multi-Range Mode
     ========================================================= -->

<div id="rebateCheckerPage" class="page" style="display:none;">

  <!-- HEADER -->
  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    border-bottom:2px solid #007bff;
    padding:15px;
    background:white;
    border-radius:8px;
  ">

    <h3 style="
      margin:0;
      padding:0;
      line-height:1;
      color:#007bff;
    ">
      Rebate Checker (Multi-Range Mode)
    </h3>

    <div style="
      display:flex;
      gap:5px;
      align-items:center;
    ">

      <!-- IMPORTANT:
           Uses the application's existing navigation function.
           Do NOT create another openMainSystem() here.
      -->
      <button
        type="button"
        onclick="openMainSystem()"
        style="
          background:#6c757d;
          color:white;
          border:none;
          padding:8px 16px;
          border-radius:4px;
          cursor:pointer;
          font-weight:bold;
          width:auto;
        ">
        Back
      </button>

      <!-- Uses the application's existing logout() function -->
      <button
        type="button"
        onclick="logout()"
        style="
          background-color:#dc3545;
          color:white;
          border:none;
          padding:8px 16px;
          border-radius:4px;
          cursor:pointer;
          font-weight:bold;
          width:auto;
        ">
        Logout
      </button>

    </div>
  </div>


  <!-- MAIN CARD -->
  <div class="card">

    <!-- INFORMATION -->
    <div style="
      background-color:#e7f3ff;
      color:#004085;
      border:1px solid #b8daff;
      padding:15px;
      border-radius:4px;
      margin-bottom:20px;
      font-size:13px;
      line-height:1.5;
    ">
      <strong>Checker Mode:</strong>
      This tool supports multiple date ranges.
      All ranges are summarized in the output below.

      <br>

      <em>
        Note: Calculations in Checker Mode are not saved to history.
      </em>
    </div>


    <!-- =====================================================
         BILLING CYCLE / ANCHOR / REBATE TYPE
         ===================================================== -->

    <div style="
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:15px;
      margin-bottom:15px;
    ">

      <!-- BILLING CYCLE -->
      <div class="input-group">

        <label style="
          font-weight:bold;
          font-size:12px;
        ">
          Billing Cycle
        </label>

        <select
          id="bcTypeChk"
          onchange="toggleAnchorChk()"
          style="
            padding:8px;
            width:100%;
          "
        >

          <option value="A">
            A - 1st of Month
          </option>

          <option value="B">
            B - 8th of Month
          </option>

          <option value="C">
            C - 15th of Month
          </option>

          <option value="D">
            D - 22nd of Month
          </option>

          <option value="E">
            E - Manual Monthly
          </option>

          <option value="Quarterly">
            Quarterly
          </option>

          <option value="Semi">
            Semi-Annual
          </option>

          <option value="Annual">
            Annual
          </option>

        </select>

      </div>


      <!-- ANCHOR -->
      <div class="input-group">

        <label style="
          font-weight:bold;
          font-size:12px;
        ">
          Cycle Start (Anchor)
        </label>

        <input
          type="date"
          id="bcAnchorChk"
          disabled
          style="
            padding:8px;
            width:100%;
          "
        >

      </div>


      <!-- REBATE TYPE -->
      <div class="input-group">

        <label style="
          font-weight:bold;
          font-size:12px;
        ">
          Rebate Type
        </label>

        <select
          id="rebateTypeChk"
          style="
            padding:8px;
            width:100%;
          "
        >

          <option value="1.0">
            No Connection (100%)
          </option>

          <option value="0.3">
            Slow / Intermittent (30%)
          </option>

        </select>

      </div>

    </div>


    <!-- =====================================================
         PLAN / CRM
         ===================================================== -->

    <div style="
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-bottom:15px;
    ">

      <!-- PLAN -->
      <div class="input-group">

        <label style="
          font-weight:bold;
          font-size:12px;
        ">
          Plan Amount
        </label>

        <input
          type="number"
          id="rbPlanChk"
          placeholder="0.00"
          style="
            padding:8px;
            width:100%;
          "
        >

      </div>


      <!-- CRM -->
      <div class="input-group">

        <label style="
          font-weight:bold;
          font-size:12px;
        ">
          CRM
        </label>

        <select
          id="rbCrmChk"
          style="
            padding:8px;
            width:100%;
          "
        >

          <option value="IBAS">
            IBAS
          </option>

          <option value="ICMS">
            ICMS
          </option>

        </select>

      </div>

    </div>


    <hr style="
      border:0;
      border-top:1px solid #eee;
      margin:15px 0;
    ">


    <!-- =====================================================
         DATE RANGE CONTAINER
         ===================================================== -->

    <div id="rebateRowsChk">

      <!-- FIRST RANGE -->
      <div
        class="rb-row-chk"
        style="
          display:flex;
          gap:10px;
          background:#f9f9f9;
          padding:10px;
          border-radius:4px;
          margin-bottom:10px;
          align-items:flex-end;
          border:1px solid #ddd;
        "
      >

        <!-- START DATE -->
        <div style="flex:1;">

          <label style="
            font-size:10px;
          ">
            Start Date
          </label>

          <input
            type="date"
            class="rbStartChk"
            onchange="calcRowChk(this)"
            style="
              width:100%;
              padding:5px;
            "
          >

        </div>


        <!-- RESTORATION -->
        <div style="flex:1;">

          <label style="
            font-size:10px;
          ">
            Restoration Date
          </label>

          <input
            type="date"
            class="rbRestoreChk"
            onchange="calcRowChk(this)"
            style="
              width:100%;
              padding:5px;
            "
          >

        </div>


        <!-- DAYS -->
        <div style="width:60px;">

          <label style="
            font-size:10px;
          ">
            Days
          </label>

          <input
            type="text"
            class="rbDaysChk"
            readonly
            style="
              text-align:center;
              background:#e9ecef;
              width:100%;
              padding:5px;
              border:1px solid #ccc;
            "
          >

        </div>


        <!-- REMOVE -->
        <button
          type="button"
          onclick="removeRebateRowChk(this)"
          style="
            background:#dc3545;
            color:white;
            padding:5px 12px;
            border:none;
            border-radius:4px;
            height:32px;
            cursor:pointer;
            font-size:10px;
            font-weight:bold;
          "
        >
          REMOVE
        </button>

      </div>

    </div>


    <!-- =====================================================
         BUTTONS
         ===================================================== -->

    <div style="
      display:flex;
      gap:10px;
      margin-top:15px;
      flex-wrap:wrap;
    ">

      <!-- ADD ROW -->
      <button
        type="button"
        onclick="addRebateRowChk()"
        class="nav-btn"
        style="
          width:auto;
          background:#6c757d;
          color:white;
          border:none;
          padding:10px 18px;
          border-radius:4px;
          cursor:pointer;
          font-weight:bold;
        "
      >
        + Add Row
      </button>


      <!-- CALCULATE -->
      <button
        type="button"
        onclick="processRebateChk()"
        class="search-btn"
        style="
          width:auto;
          background:#007bff;
          color:white;
          border:none;
          padding:10px 18px;
          border-radius:4px;
          cursor:pointer;
          font-weight:bold;
        "
      >
        Calculate Only
      </button>


      <!-- CLEAR -->
      <button
        type="button"
        onclick="clearCheckerForm()"
        class="nav-btn"
        style="
          width:auto;
          background:#333;
          color:white;
          border:none;
          padding:10px 18px;
          border-radius:4px;
          cursor:pointer;
          font-weight:bold;
        "
      >
        Clear
      </button>


      <!-- COPY -->
      <button
        type="button"
        onclick="copyResultsChk()"
        style="
          width:auto;
          background:#28a745;
          color:white;
          border:none;
          padding:10px 18px;
          border-radius:4px;
          cursor:pointer;
          font-weight:bold;
        "
      >
        Copy Output
      </button>

    </div>

  </div>


  <!-- =====================================================
       OUTPUT
       ===================================================== -->

  <div
    id="rbOutputChk"
    style="
      background:#f8f9fa;
      border:2px dashed #007bff;
      padding:15px;
      font-family:monospace;
      white-space:pre-wrap;
      font-size:13px;
      margin-top:10px;
      color:#333;
      min-height:50px;
      border-radius:8px;
    "
  ></div>

</div>


<!-- =========================================================
     STEP 2 CHECKER JAVASCRIPT
     ========================================================= -->

<script>

/* ============================================================
   CHECKER CONFIGURATION
   ============================================================ */

const rbCfgChk = {

  A: {
    d: 1,
    m: 1,
    f: 1
  },

  B: {
    d: 8,
    m: 1,
    f: 1
  },

  C: {
    d: 15,
    m: 1,
    f: 1
  },

  D: {
    d: 22,
    m: 1,
    f: 1
  },

  E: {
    manual: true,
    m: 1,
    f: 1
  },

  Quarterly: {
    manual: true,
    m: 3,
    f: 2.75
  },

  Semi: {
    manual: true,
    m: 6,
    f: 5.5
  },

  Annual: {
    manual: true,
    m: 12,
    f: 11
  }

};


/* ============================================================
   DATE UTILITY
   Unique name to avoid conflict with Monthly Calculator
   ============================================================ */

function localDateChk(value) {

  if (!value) {
    return null;
  }

  const parts = value.split("-").map(Number);

  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


/* ============================================================
   SHORT DATE
   ============================================================ */

function fShortDateChk(d) {

  if (!d) {
    return "";
  }

  return d.toLocaleDateString(
    "en-US",
    {
      month: "short",
      day: "2-digit"
    }
  ).toUpperCase()
  + " "
  + d.getDate()
  + ", "
  + d.getFullYear();

}


/* ============================================================
   MONTH + DAY
   ============================================================ */

function fMonthDayChk(d) {

  if (!d) {
    return "";
  }

  return d.toLocaleDateString(
    "en-US",
    {
      month: "short",
      day: "2-digit"
    }
  ).toUpperCase();

}


/* ============================================================
   BILLING CYCLE ANCHOR
   ============================================================ */

function toggleAnchorChk() {

  const cycleElement =
    document.getElementById("bcTypeChk");

  const anchorElement =
    document.getElementById("bcAnchorChk");

  const cycleKey =
    cycleElement.value;

  const cfg =
    rbCfgChk[cycleKey];

  if (!cfg) {
    anchorElement.disabled = true;
    anchorElement.value = "";
    return;
  }

  anchorElement.disabled =
    !cfg.manual;

}


/* ============================================================
   ADD DATE RANGE
   ============================================================ */

function addRebateRowChk() {

  const container =
    document.getElementById("rebateRowsChk");

  const firstRow =
    container.firstElementChild;

  if (!firstRow) {
    return;
  }

  const clone =
    firstRow.cloneNode(true);

  clone
    .querySelectorAll("input")
    .forEach(input => {
      input.value = "";
    });

  container.appendChild(clone);

}


/* ============================================================
   REMOVE DATE RANGE
   ============================================================ */

function removeRebateRowChk(button) {

  const container =
    document.getElementById("rebateRowsChk");

  const rows =
    container.querySelectorAll(".rb-row-chk");

  /*
   * Always keep at least one row.
   */

  if (rows.length <= 1) {

    const row =
      button.closest(".rb-row-chk");

    row.querySelector(".rbStartChk").value = "";
    row.querySelector(".rbRestoreChk").value = "";
    row.querySelector(".rbDaysChk").value = "";

    return;
  }

  const row =
    button.closest(".rb-row-chk");

  if (row) {
    row.remove();
  }

}


/* ============================================================
   CALCULATE DAYS FOR ONE ROW
   ============================================================ */

function calcRowChk(element) {

  const row =
    element.closest(".rb-row-chk");

  if (!row) {
    return;
  }

  const startValue =
    row.querySelector(".rbStartChk").value;

  const restoreValue =
    row.querySelector(".rbRestoreChk").value;

  const daysField =
    row.querySelector(".rbDaysChk");

  const startDate =
    localDateChk(startValue);

  const restoreDate =
    localDateChk(restoreValue);

  if (!startDate || !restoreDate) {

    daysField.value = "";

    return;
  }

  const difference =
    Date.UTC(
      restoreDate.getFullYear(),
      restoreDate.getMonth(),
      restoreDate.getDate()
    )
    -
    Date.UTC(
      startDate.getFullYear(),
      startDate.getMonth(),
      startDate.getDate()
    );

  const days =
    Math.floor(
      difference / 86400000
    );

  daysField.value =
    days > 0 ? days : 0;

}


/* ============================================================
   PROCESS CHECKER
   ============================================================ */

function processRebateChk() {

  const plan =
    parseFloat(
      document.getElementById("rbPlanChk").value
    );

  const cycleElement =
    document.getElementById("bcTypeChk");

  const cycleKey =
    cycleElement.value;

  const cycleLabelRaw =
    cycleElement
      .options[
        cycleElement.selectedIndex
      ]
      .text
      .toUpperCase();

  const cfg =
    rbCfgChk[cycleKey];

  const typeFactor =
    parseFloat(
      document.getElementById("rebateTypeChk").value
    );

  const crm =
    document.getElementById("rbCrmChk").value;


  /* ----------------------------------------------------------
     VALIDATION
     ---------------------------------------------------------- */

  if (
    isNaN(plan) ||
    plan <= 0
  ) {

    alert("Enter Plan Amount.");

    return;
  }

  if (!cfg) {

    alert("Invalid Billing Cycle.");

    return;
  }


  /* ----------------------------------------------------------
     VARIABLES
     ---------------------------------------------------------- */

  let totalGrand = 0;

  let totalDays = 0;

  let issueRangesStr = [];

  let restorationDatesStr = [];

  let periodsArr = [];

  let formulasArr = [];

  let ranges = [];


  /* ----------------------------------------------------------
     COLLECT DATE RANGES
     ---------------------------------------------------------- */

  document
    .querySelectorAll(".rb-row-chk")
    .forEach(row => {

      const startValue =
        row.querySelector(".rbStartChk").value;

      const restoreValue =
        row.querySelector(".rbRestoreChk").value;

      if (
        startValue &&
        restoreValue
      ) {

        const startDate =
          localDateChk(startValue);

        const restoreDate =
          localDateChk(restoreValue);

        if (
          restoreDate <= startDate
        ) {

          alert(
            "Restoration Date must be later than Start Date."
          );

          return;
        }

        const endDate =
          new Date(
            restoreDate.getTime()
            - 86400000
          );

        ranges.push({

          s: startDate,

          r: restoreDate,

          e: endDate

        });

        issueRangesStr.push(

          `${fMonthDayChk(startDate)} - ` +
          `${fMonthDayChk(endDate)}, ` +
          `${endDate.getFullYear()}`

        );

        restorationDatesStr.push(

          `${fMonthDayChk(restoreDate)}, ` +
          `${restoreDate.getFullYear()}`

        );

      }

    });


  /* ----------------------------------------------------------
     CHECK DATE RANGE
     ---------------------------------------------------------- */

  if (!ranges.length) {

    alert(
      "Please enter at least one date range."
    );

    return;
  }


  /* ----------------------------------------------------------
     MANUAL / PERIODIC ANCHOR
     ---------------------------------------------------------- */

  let anchorDate = null;

  if (cfg.manual) {

    const anchorValue =
      document.getElementById("bcAnchorChk").value;

    if (!anchorValue) {

      alert(
        "Please set a Cycle Start Anchor date."
      );

      return;
    }

    anchorDate =
      localDateChk(anchorValue);

  }


  /* ==========================================================
     PROCESS EVERY RANGE
     ========================================================== */

  ranges.forEach(rng => {

    let cur =
      new Date(rng.s);


    while (cur <= rng.e) {

      let bS;


      /* ------------------------------------------------------
         MANUAL MONTHLY / QUARTERLY / SEMI / ANNUAL
         ------------------------------------------------------ */

      if (cfg.manual) {

        bS =
          new Date(anchorDate);

        /*
         * Move anchor forward until it is
         * the first cycle start after the
         * current date.
         */

        while (
          new Date(
            bS.getFullYear(),
            bS.getMonth() + cfg.m,
            bS.getDate()
          ) <= cur
        ) {

          bS.setMonth(
            bS.getMonth() + cfg.m
          );

        }

        /*
         * If current date occurs before
         * calculated anchor, move backwards.
         */

        while (cur < bS) {

          bS.setMonth(
            bS.getMonth() - cfg.m
          );

        }

      }


      /* ------------------------------------------------------
         STANDARD MONTHLY BILLING CYCLE
         ------------------------------------------------------ */

      else {

        bS =
          new Date(
            cur.getFullYear(),
            cur.getMonth(),
            cfg.d
          );

        if (
          cur.getDate() < cfg.d
        ) {

          bS.setMonth(
            bS.getMonth() - 1
          );

        }

      }


      /* ------------------------------------------------------
         BILLING PERIOD END
         ------------------------------------------------------ */

      const bE =
        new Date(
          bS.getFullYear(),
          bS.getMonth() + cfg.m,
          bS.getDate() - 1
        );


      /* ------------------------------------------------------
         AFFECTED START
         ------------------------------------------------------ */

      const aS =
        cur > bS
          ? cur
          : bS;


      /* ------------------------------------------------------
         AFFECTED END
         ------------------------------------------------------ */

      const aE =
        rng.e < bE
          ? rng.e
          : bE;


      /* ------------------------------------------------------
         NUMBER OF AFFECTED DAYS
         ------------------------------------------------------ */

      const affectedDifference =
        Date.UTC(
          aE.getFullYear(),
          aE.getMonth(),
          aE.getDate()
        )
        -
        Date.UTC(
          aS.getFullYear(),
          aS.getMonth(),
          aS.getDate()
        );

      const d =
        Math.floor(
          affectedDifference /
          86400000
        ) + 1;


      /* ------------------------------------------------------
         NUMBER OF DAYS IN BILLING PERIOD
         ------------------------------------------------------ */

      const periodDifference =
        Date.UTC(
          bE.getFullYear(),
          bE.getMonth(),
          bE.getDate()
        )
        -
        Date.UTC(
          bS.getFullYear(),
          bS.getMonth(),
          bS.getDate()
        );

      const pD =
        Math.floor(
          periodDifference /
          86400000
        ) + 1;


      /* ------------------------------------------------------
         BASE REBATE
         ------------------------------------------------------ */

      const baseAmt =
        (
          plan *
          cfg.f
        )
        /
        pD
        *
        d
        *
        typeFactor;


      /* ------------------------------------------------------
         CRM ADJUSTMENT
         ------------------------------------------------------ */

      const finalAmt =
        crm === "ICMS"
          ? baseAmt / 1.12
          : baseAmt;


      /* ------------------------------------------------------
         PERIOD DISPLAY
         ------------------------------------------------------ */

      periodsArr.push(

        `${fMonthDayChk(bS)} - ` +
        `${fMonthDayChk(bE)}, ` +
        `${bE.getFullYear()}`

      );


      /* ------------------------------------------------------
         FORMULA DISPLAY
         ------------------------------------------------------ */

      let formulaText =
        `FORMULA: ` +
        `${fMonthDayChk(aS)} - ` +
        `${fMonthDayChk(aE)}: ` +
        `(${plan} / ${pD}) * ${d}`;

      if (typeFactor === 0.3) {

        formulaText +=
          ` * 0.3`;

      }

      if (crm === "ICMS") {

        formulaText +=
          ` / 1.12`;

      }

      formulaText +=
        ` = ${finalAmt.toFixed(4)}`;

      formulasArr.push(
        formulaText
      );


      /* ------------------------------------------------------
         TOTALS
         ------------------------------------------------------ */

      totalGrand += finalAmt;

      totalDays += d;


      /* ------------------------------------------------------
         MOVE TO NEXT BILLING PERIOD
         ------------------------------------------------------ */

      cur =
        new Date(
          bE.getTime()
          + 86400000
        );

    }

  });


  /* ==========================================================
     BILLING CYCLE DISPLAY
     ========================================================== */

  const cycleParts =
    cycleLabelRaw.split(" - ");

  let cleanCycle;

  if (cycleParts.length > 1) {

    cleanCycle =
      cycleParts[0]
      + " - "
      + cycleParts[1].split(" ")[0];

  } else {

    cleanCycle =
      cycleLabelRaw;

  }


  /* ==========================================================
     REMOVE DUPLICATE PERIOD LABELS
     ========================================================== */

  const uniquePeriods =
    [...new Set(periodsArr)];


  /* ==========================================================
     FINAL OUTPUT
     ========================================================== */

  const output =

`ISSUE START DATE: ${issueRangesStr.join(" | ")}
RESTORATION DATE: ${restorationDatesStr.join(" | ")}
BILLING CYCLE: ${cleanCycle} / CRM: ${crm}
PLAN: ${plan.toFixed(2)}
TOTAL REQUESTED DAYS: ${totalDays}

BREAKDOWN:
PERIOD: ${uniquePeriods.join(" | ")}
${formulasArr.join("\n")}

ESTIMATED REBATE AMOUNT: ${totalGrand.toFixed(2)}`;


  /* ----------------------------------------------------------
     DISPLAY
     ---------------------------------------------------------- */

  document
    .getElementById("rbOutputChk")
    .innerText = output;

}


/* ============================================================
   COPY CHECKER RESULT
   ============================================================ */

function copyResultsChk() {

  const output =
    document
      .getElementById("rbOutputChk")
      .innerText;

  if (!output) {

    alert(
      "No results to copy!"
    );

    return;
  }


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(output)
      .then(() => {

        alert(
          "Copied to clipboard!"
        );

      })
      .catch(() => {

        fallbackCopyChk(output);

      });

  } else {

    fallbackCopyChk(output);

  }

}


/* ============================================================
   FALLBACK COPY
   ============================================================ */

function fallbackCopyChk(text) {

  const textarea =
    document.createElement("textarea");

  textarea.value = text;

  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-999999px";

  document.body.appendChild(
    textarea
  );

  textarea.focus();

  textarea.select();

  try {

    document.execCommand(
      "copy"
    );

    alert(
      "Copied to clipboard!"
    );

  } catch (error) {

    alert(
      "Unable to copy automatically. Please copy the result manually."
    );

  }

  document.body.removeChild(
    textarea
  );

}


/* ============================================================
   CLEAR CHECKER
   ============================================================ */

function clearCheckerForm() {

  if (
    !confirm(
      "Clear Checker form?"
    )
  ) {

    return;
  }


  /*
   * Clear all input fields belonging
   * to the Checker only.
   */

  document
    .querySelectorAll(
      "#rebateCheckerPage input"
    )
    .forEach(input => {

      input.value = "";

    });


  /*
   * Reset billing cycle.
   */

  document
    .getElementById(
      "bcTypeChk"
    )
    .value = "A";


  /*
   * Reset rebate type.
   */

  document
    .getElementById(
      "rebateTypeChk"
    )
    .value = "1.0";


  /*
   * Reset CRM.
   */

  document
    .getElementById(
      "rbCrmChk"
    )
    .value = "IBAS";


  /*
   * Make anchor disabled again.
   */

  document
    .getElementById(
      "bcAnchorChk"
    )
    .disabled = true;


  /*
   * Clear output.
   */

  document
    .getElementById(
      "rbOutputChk"
    )
    .innerText = "";


  /*
   * Remove additional rows.
   */

  const container =
    document.getElementById(
      "rebateRowsChk"
    );

  while (
    container.children.length > 1
  ) {

    container.removeChild(
      container.lastElementChild
    );

  }


  /*
   * Clear the remaining first row.
   */

  const firstRow =
    container.firstElementChild;

  if (firstRow) {

    firstRow
      .querySelector(
        ".rbStartChk"
      )
      .value = "";

    firstRow
      .querySelector(
        ".rbRestoreChk"
      )
      .value = "";

    firstRow
      .querySelector(
        ".rbDaysChk"
      )
      .value = "";

  }

}


/* ============================================================
   INITIALIZE CHECKER
   ============================================================ */

function initializeRebateChecker() {

  const cycle =
    document.getElementById(
      "bcTypeChk"
    );

  if (!cycle) {
    return;
  }

  toggleAnchorChk();

}


/*
 * Initialize after the page is available.
 *
 * This does NOT call the application's
 * global navigation functions.
 */

setTimeout(
  initializeRebateChecker,
  100
);

</script>
